name: Bug report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. See [SECURITY.md](https://github.com/progress/repoarmor/blob/main/SECURITY.md).
  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact command, with any tokens or private repository names removed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and output
      description: Include the full output or traceback, with secrets removed.
      render: text
    validations:
      required: true
  - type: input
    id: repoarmor-version
    attributes:
      label: RepoArmor version
      placeholder: "0.3.1"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: input
    id: trufflehog-version
    attributes:
      label: TruffleHog version
      description: Output of `trufflehog --version`, if relevant.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
